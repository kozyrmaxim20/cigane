function renderPlayersSplit(list, arr, q){
  const t = I18N[currentLang];
  // arr уже отсортирован по очкам — это «официальное» место; сортировка ниже только для вида
  const stats = new Map(arr.map(p => [p, playerStats(p)]));
  const pointsRank = new Map(arr.map((p, i) => [p, i]));
  const key = playerSortKey;
  const sorted = [...arr].sort((a, b) => (stats.get(b)[key] - stats.get(a)[key]) || (pointsRank.get(a) - pointsRank.get(b)));
  const shown = sorted.filter(p => !q || String(p.name || '').toLowerCase().includes(q));
  if(!shown.some(p => String(p.id) === String(selectedPlayerId))){
    selectedPlayerId = shown.length ? shown[0].id : null;
  }
  const val = (p) => stats.get(p)[key];
  const top = Math.max(1, ...sorted.map(val));
  const unit = { pts: t.unitPts, cmp: t.unitCmp, ver: t.unitVer }[key];

  // общая статистика
  const tot = [...stats.values()].reduce((m, s) => ({ pts: m.pts + s.pts, cmp: m.cmp + s.cmp, ver: m.ver + s.ver }), { pts: 0, cmp: 0, ver: 0 });
  const statsHtml = `<div class="pl-stats">${[
      ['👥', arr.length, t.stPlayers], ['✦', tot.pts, t.stPoints], ['✓', tot.cmp, t.stCompletions], ['🛡', tot.ver, t.stVerifications],
    ].map(([ico, v, label], i) => `<div class="pl-stat" style="--i:${i}">
      <span class="pl-stat-ico">${ico}</span><b data-count="${v}">0</b><span>${escapeHtml(label)}</span></div>`).join('')}</div>`;

  const tabs = `<div class="pl-tabs" role="tablist">${[['pts', t.sortPts], ['cmp', t.sortCmp], ['ver', t.sortVer]]
    .map(([k, label]) => `<button class="pl-tab${k === key ? ' on' : ''}" data-sort="${k}" role="tab" aria-selected="${k === key}">${escapeHtml(label)}</button>`).join('')}
    <span class="pl-tab-glider" aria-hidden="true"></span></div>`;

  // пьедестал — без поиска
  const podiumOrder = [1, 0, 2];
  const podium = (!q && sorted.length) ? `<div class="pl-podium">${
    podiumOrder.filter(i => sorted[i]).map(i => {
      const p = sorted[i];
      const sparks = i === 0 ? [8, 26, 47, 66, 84].map((x, j) =>
        `<span class="pod-spark" style="left:${x}%;--s:${j * 0.45}s;--h:${50 + (j % 3) * 18}px"></span>`).join('') : '';
      return `<button class="pod-card pod-${i + 1}" data-id="${escapeHtml(String(p.id))}" style="--d:${[0.12, 0, 0.24][i]}s">
        ${i === 0 ? '<span class="pod-beam" aria-hidden="true"></span>' + sparks + '<span class="pod-crown">👑</span>' : ''}
        <span class="pod-ava${p.avatar ? ' has-img' : ''}">${avatarInner(p)}</span>
        <span class="pod-name">${escapeHtml(p.name)}</span>
        <span class="pod-pts"><b data-count="${val(p)}">0</b> <small>${escapeHtml(unit)}</small></span>
        <span class="pod-rank">#${i + 1}</span>
      </button>`;
    }).join('')
  }</div>` : '';

  const items = shown.map((p, k) => {
    const idx = sorted.indexOf(p);
    const st = stats.get(p);
    const medal = idx === 0 ? '👑' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';
    const share = Math.max(2, Math.round(val(p) / top * 100));
    return `<button class="pl-item${String(p.id) === String(selectedPlayerId) ? ' active' : ''}${idx < 3 ? ' pl-top' + (idx + 1) : ''}" data-id="${escapeHtml(String(p.id))}" style="--d:${0.25 + k * 0.05}s">
      <span class="pl-line">
        <span class="pl-rank">#${idx + 1}</span>
        ${medal ? `<span class="pl-medal">${medal}</span>` : '<span class="pl-medal is-empty"></span>'}
        <span class="pl-name">${escapeHtml(p.name)}</span>
        <span class="pl-minis">
          <span class="pl-mini${key === 'cmp' ? ' on' : ''}" title="${escapeHtml(t.stCompletions)}">${st.cmp}✓</span>
          <span class="pl-mini${key === 'ver' ? ' on' : ''}" title="${escapeHtml(t.stVerifications)}">${st.ver}✦</span>
        </span>
        <span class="pl-pts">${key === 'pts' ? st.pts : val(p)}</span>
      </span>
      <span class="pl-bar"><i style="width:${share}%"></i></span>
    </button>`;
  }).join('');

  list.innerHTML = `${statsHtml}${tabs}${podium}<div class="pl-split">
    <div class="pl-side">
      <div class="pl-side-head">${escapeHtml(t.playersSideTitle)}<span class="lvl-group-count">${shown.length}</span></div>
      <div class="pl-list">${items || `<div class="pl-empty sm">${escapeHtml(t.searchEmpty)}</div>`}</div>
    </div>
    <div class="pl-pane" id="plPane"></div>
  </div>`;

  // подложка вкладок плавно едет под выбранную
  const placeGlider = (animate) => {
    const on = list.querySelector('.pl-tab.on'), g = list.querySelector('.pl-tab-glider');
    if(!on || !g) return;
    if(!animate) g.style.transition = 'none';
    g.style.width = on.offsetWidth + 'px';
    g.style.transform = `translateX(${on.offsetLeft}px)`;
    if(!animate){ g.getBoundingClientRect(); g.style.transition = ''; }
  };
  requestAnimationFrame(() => placeGlider(false));
  list.querySelectorAll('.pl-tab').forEach(btn => btn.addEventListener('click', () => {
    if(btn.dataset.sort === playerSortKey) return;
    list.querySelectorAll('.pl-tab').forEach(b => b.classList.toggle('on', b === btn));
    placeGlider(true);
    playerSortKey = btn.dataset.sort;
    setTimeout(() => render(), 200);
  }));

  countUp(list.querySelector('.pl-stats'));
  const pod = list.querySelector('.pl-podium');
  if(pod) countUp(pod);

  const select = (id) => {
    if(String(id) === String(selectedPlayerId)) return;
    selectedPlayerId = id;
    list.querySelectorAll('.pl-item').forEach(b => b.classList.toggle('active', b.getAttribute('data-id') === String(id)));
    renderPlayerPane();
  };
  list.querySelectorAll('.pl-item, .pod-card').forEach(btn => {
    btn.addEventListener('click', () => select(btn.getAttribute('data-id')));
  });
  renderPlayerPane();
}

    const th = row.querySelector('.thumb.has-video');

      (tl || row).appendChild(medal);

      startRowParticles(pc, i);
      attachRankInteraction(row, ripple, i);
    }
  });

  if(q && shown === 0){
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.textContent = I18N[currentLang].searchEmpty;
    list.appendChild(empty);
  }

// level detail modal
function youtubeId(url){
  if(!url) return '';
  let id = '';
  try{
    const u = new URL(url);
    if(u.hostname.includes('youtu.be')){
      id = u.pathname.slice(1);
    } else if(u.searchParams.get('v')){
      id = u.searchParams.get('v');
    } else if(u.pathname.includes('/embed/')){
      id = u.pathname.split('/embed/')[1];
    } else if(u.pathname.includes('/shorts/')){
      id = u.pathname.split('/shorts/')[1];
    }
  }catch(e){
    const m = String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
    if(m) id = m[1];
  }
  return (id || '').split(/[?&]/)[0];
}
function youtubeThumb(id){ return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : ''; }
function rowThumbSrc(lvl){
  if(lvl.thumbnail) return lvl.thumbnail;
  const id = youtubeId(lvl.videoUrl);
  return id ? youtubeThumb(id) : '';
}

function fallbackCopy(text, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if(done) done();
  }catch(e){}
}

function statBox(label, value, extraClass, copyable){

    : '';

    <div class="stat-label">${escapeHtml(label)}</div>

}

// position history / records helpers
function countryFlag(code){
  if(!code) return '🌐';
  const c = String(code).trim();
  if(/^[A-Za-z]{2}$/.test(c)){
    const base = 0x1F1E6;
    return [...c.toUpperCase()].map(ch => String.fromCodePoint(base + (ch.charCodeAt(0) - 65))).join('');
  }
  return c; // allow raw emoji / custom text
}

function buildHistoryEntries(lvl, idx, t){
  const entries = [];
  if(lvl.historyExtra){
    String(lvl.historyExtra).split('\n').forEach(line => {
      const parts = line.split('|').map(p => p.trim());
      if(!parts[0]) return;
      entries.push({ date: parts[0], position: parts[1] || null, note: parts[2] || '', isAdd: false });
    });
  }

  // от старых к новым — так видно, куда уровень двигался
  entries.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let prevPos = null;
  entries.forEach((e, i) => {
    const pos = (e.position === null || e.position === '') ? null : Number(e.position);
    // плюс — у самой первой записи: до неё позиции не было
    e.isAdd = (prevPos === null);
    e.dir = 0;
    if(!e.isAdd && pos !== null && prevPos !== null){
      if(pos < prevPos) e.dir = 1;        // номер меньше — уровень поднялся
      else if(pos > prevPos) e.dir = -1;  // номер больше — уровень упал ниже
    }
    if(pos !== null) prevPos = pos;
  });

  entries.reverse();
  return entries;
}

function parseRecordEntries(lvl){
  let recs = [];
  if(lvl.records){
    recs = String(lvl.records).split('\n').map(line => {
      const parts = line.split('|').map(p => p.trim());
      return { country: parts[0] || '', player: parts[1] || '', percent: parts[2] || '', videoUrl: parts[3] || '' };
    }).filter(r => r.player);
  }
  // верификатор рекордом не считается — только явно добавленные записи
  return recs;
}

/* ── профиль игрока ───────────────────────────────────────── */
let playerRecordsPage = 0;
let playerCtx = null;

// собираем все рекорды игрока по всем уровням классического листа
// Профиль собирается из двух источников:
//  1) поле «Прохождения», которое админ заполняет у игрока
//  2) рекорды, добавленные на страницах самих уровней
function collectPlayerRecords(player){
  const raw  = (player && typeof player === 'object') ? player.verifier : '';
  const nick = (player && typeof player === 'object') ? player.name : player;
  const nickKey = String(nick || '').trim().toLowerCase();

  const out = [];
  const seen = new Set();                       // ключ — имя уровня в нижнем регистре
  const push = (levelName, position, percent, videoUrl, listKey, lvlIdx, isVerifier) => {
    const key = String(levelName).trim().toLowerCase();
    if(!key || seen.has(key)) return;
    seen.add(key);
    const pc = percent || '100';
    const src = (listKey && Array.isArray(state[listKey])) ? state[listKey][lvlIdx] : null;
    // очки начисляются только за полное прохождение уровня, у которого они заданы
    const gained = (String(pc).trim() === '100' && src && listKey !== 'futureLevels') ? (Number(src.points) || 0) : 0;
    out.push({
      levelName, position, percent: pc, videoUrl: videoUrl || '',
      listKey: listKey || 'other', lvlIdx: (lvlIdx ?? null), gained,
      isVerifier: !!isVerifier,
    });
  };

  // ── 1. прохождения, вбитые админом ──
  String(raw || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean).forEach(name => {
    let position = null, percent = '100', videoUrl = '', foundKey = 'other', foundIdx = null;
    for(const key of ['levels', 'futureLevels', 'nonListedLevels']){
      const arr = state[key];
      if(!Array.isArray(arr)) continue;
      const idx = arr.findIndex(l => String(l.name).trim().toLowerCase() === name.toLowerCase());
      if(idx < 0) continue;
      foundKey = key;
      foundIdx = idx;
      if(key === 'levels') position = idx + 1;
      const rec = parseRecordEntries(arr[idx])
        .find(r => String(r.player).trim().toLowerCase() === nickKey);
      if(rec){
        if(rec.percent) percent = rec.percent;
        if(rec.videoUrl) videoUrl = rec.videoUrl;
      }
      break;
    }
    push(name, position, percent, videoUrl, foundKey, foundIdx);
  });

  // ── 2. уровни, где игрок указан верификатором — засчитываются как 100% ──
  if(nickKey){
    ['levels', 'nonListedLevels', 'futureLevels'].forEach(key => {
      const arr = state[key];
      if(!Array.isArray(arr)) return;
      arr.forEach((lvl, idx) => {
        const vs = String(lvl.verifier || '').split(/[,\n]/).map(x => x.trim().toLowerCase());
        if(!vs.includes(nickKey)) return;
        // будущий уровень ещё не пройден: без процента и без очков
        const pc = (key === 'futureLevels') ? (parseProgress(lvl.progress) || '0') : '100';
        push(lvl.name, key === 'levels' ? idx + 1 : null, pc, lvl.verificationUrl || lvl.videoUrl || '', key, idx, true);
      });
    });
  }

  // ── 3. рекорды со страниц уровней ──
  if(nickKey){
    ['levels', 'futureLevels', 'nonListedLevels'].forEach(key => {
      const arr = state[key];
      if(!Array.isArray(arr)) return;
      arr.forEach((lvl, idx) => {
        parseRecordEntries(lvl).forEach(r => {
          if(String(r.player).trim().toLowerCase() !== nickKey) return;
          push(lvl.name, key === 'levels' ? idx + 1 : null, r.percent, r.videoUrl, key, idx);
        });
      });
    });
  }

  // уровень мог попасть в список раньше (из «Прохождений» или рекордов) —
  // флаг верификатора проставляем отдельным проходом, иначе дедуп по имени его терял
  if(nickKey){
    out.forEach(r => {
      const arr = state[r.listKey];
      const lvl = (Array.isArray(arr) && r.lvlIdx !== null) ? arr[r.lvlIdx] : null;
      if(!lvl) return;
      const vs = String(lvl.verifier || '').split(/[,\n]/).map(x => x.trim().toLowerCase());
      if(vs.includes(nickKey)) r.isVerifier = true;
    });
  }

  const ORDER = { levels: 0, nonListedLevels: 1, futureLevels: 2, other: 3 };
  out.sort((a, b) =>
    (ORDER[a.listKey] - ORDER[b.listKey]) || ((a.position || 9999) - (b.position || 9999))
  );
  return out;
}

// очки игрока = сумма очков пройденных уровней классического листа
// прогресс: одно число («50») либо диапазон («55-100»)
function parseProgress(raw){
  const str = String(raw ?? '').trim().replace(/%/g, '').replace(/\s*[–—]\s*/g, '-').replace(/\s*-\s*/g, '-');
  if(!str) return '';
  const m = str.match(/^(\d{1,3})(?:-(\d{1,3}))?$/);
  if(!m) return '';
  const cl = (n) => Math.max(0, Math.min(100, Number(n)));
  const a = cl(m[1]);
  if(m[2] === undefined) return String(a);
  const b = cl(m[2]);
  return (a <= b) ? `${a}-${b}` : `${b}-${a}`;
}
function formatProgress(raw){
  const v = parseProgress(raw);
  return v ? v + '%' : '0%';
}

function computePlayerPoints(player){
  return collectPlayerRecords(player).reduce((sum, r) => sum + (r.gained || 0), 0);
}

// сумма очков по конкретному листу — для разбивки в профиле
function pointsByList(recs, listKey){
  return recs.filter(r => r.listKey === listKey).reduce((sum, r) => sum + (r.gained || 0), 0);
}

function ladderSteps(player){

function ladderHtml(player, uid){

// верхняя граница прогресса: «40-100» → 100, «67» → 67
function progressMax(raw){
  const v = parseProgress(raw);
  if(!v) return 0;
  const parts = v.split('-').map(Number);
  return Math.max(0, Math.min(100, parts[parts.length - 1]));
}

// раскладка: на широком экране — диагональная лестница, на узком — вертикальная
function layoutLadder(stage){
  const steps = [...stage.querySelectorAll('.dl-step')];
  const path = stage.querySelector('.dl-path');
  const n = steps.length;
  const W = stage.clientWidth;
  const vertical = W < 560;
  stage.classList.toggle('is-vertical', vertical);
  const pts = [];
  if(vertical){
    // ступени идут обычным потоком (цель сверху), заметки раздвигают соседей
    stage.style.height = '';
    steps.forEach(el => { el.style.left = ''; el.style.top = ''; el.style.width = ''; });
    path.setAttribute('d', '');
  } else {
    const cw = Math.min(220, Math.max(170, W * 0.3)), ch = 84;
    const H = Math.max(300, n * 82 + 40);
    stage.style.height = H + 'px';
    steps.forEach((el, i) => {
      const k = n > 1 ? i / (n - 1) : 0;
      const x = 6 + (W - cw - 12) * k;
      const y = H - ch - 30 - (H - ch - 60) * k;
      el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = cw + 'px';
      // bx/by — точка, где линия входит в ступень снизу: там останавливается альпинист
      pts.push({ x: x + cw / 2, y: y + ch / 2, bx: x + cw / 2, by: y + ch });
    });
    let d = '';
    pts.forEach((p, i) => {
      if(!i){ d = `M ${p.x} ${p.y}`; return; }
      const q = pts[i - 1];
      d += ` L ${p.x} ${q.y} L ${p.x} ${p.y}`;   // ступенька: вправо, потом вверх
    });
    path.setAttribute('d', d);
  }
  return pts;
}

function playLadder(stage){
  const steps = [...stage.querySelectorAll('.dl-step')];
  const path = stage.querySelector('.dl-path');
  const climber = stage.querySelector('.dl-climber');
  const crown = stage.querySelector('.dl-crown');
  const pts = layoutLadder(stage);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(stage.classList.contains('is-vertical')){
    stage.classList.remove('drawn'); void stage.offsetWidth; stage.classList.add('drawn');
    steps.forEach((el, i) => {
      el.classList.remove('in');
      const bar = el.querySelector('.dl-s-bar i');
      bar.style.width = '0';
      // снизу вверх: первой появляется стартовая ступень
      setTimeout(() => { el.classList.add('in'); setTimeout(() => { bar.style.width = bar.dataset.w + '%'; }, 200); },
        reduce ? 0 : 160 + i * 200);
    });
    climber.classList.remove('show'); crown.classList.remove('show');
    return;
  }

  // линия прорисовывается снизу вверх, потом становится пунктирной
  const L = path.getTotalLength();
  path.style.transition = 'none';
  path.style.strokeDasharray = `${L} ${L}`;
  path.style.strokeDashoffset = reduce ? 0 : L;
  path.getBoundingClientRect();
  path.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1)';
  path.style.strokeDashoffset = 0;
  setTimeout(() => { path.style.transition = 'none'; path.style.strokeDasharray = '6 7'; }, reduce ? 0 : 1900);

  steps.forEach((el, i) => {
    el.classList.remove('in');
    const bar = el.querySelector('.dl-s-bar i');
    bar.style.width = '0';
    setTimeout(() => {
      el.classList.add('in');
      setTimeout(() => { bar.style.width = bar.dataset.w + '%'; }, 200);
    }, reduce ? 0 : 160 + i * 220);
  });

  // корона над целью
  const goalIdx = steps.length - 1;
  const g = steps[goalIdx];
  crown.classList.remove('show');
  crown.style.left = (parseFloat(g.style.left) + parseFloat(g.style.width) / 2 - 10) + 'px';
  crown.style.top = (parseFloat(g.style.top) - 24) + 'px';

  // «альпинист» бежит до текущей ступени (или до последней пройденной)
  let curIdx = steps.findIndex(el => el.classList.contains('s-cur'));
  if(curIdx < 0){
    const lastDone = steps.map(el => el.classList.contains('s-done')).lastIndexOf(true);
    curIdx = Math.max(0, lastDone);
  }
  const pathLenAt = (idx) => {
    if(steps.length < 2) return 0;
    // длина пути до центра ступени idx: перебором по точкам пути
    let best = 0, bestD = Infinity;
    const target = idx > 0 ? { x: pts[idx].bx, y: pts[idx].by } : pts[idx];
    for(let s = 0; s <= 120; s++){
      const len = L * s / 120, p = path.getPointAtLength(len);
      const dd = (p.x - target.x) ** 2 + (p.y - target.y) ** 2;
      if(dd < bestD){ bestD = dd; best = len; }
    }
    return best;
  };
  const target = pathLenAt(curIdx);
  climber.classList.add('show');
  const t0 = performance.now(), dur = reduce ? 1 : 1700;
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    const p = path.getPointAtLength(target * e);
    climber.style.left = p.x + 'px'; climber.style.top = p.y + 'px';
    if(k < 1) requestAnimationFrame(tick); else crown.classList.add('show');
  };
  requestAnimationFrame(tick);
}

function initLadders(root){
  root.querySelectorAll('[data-ladder]').forEach(stage => {
    stage.querySelectorAll('.dl-step').forEach(el => {
      const toggle = () => {
        const open = !el.classList.contains('open');
        el.classList.toggle('open', open);
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
    });
    // запускаем, когда лестница впервые попала в кадр
    const io = new IntersectionObserver((entries) => {
      if(entries.some(en => en.isIntersecting)){ io.disconnect(); playLadder(stage); }
    }, { threshold: 0.15 });
    io.observe(stage);
    let lastW = stage.clientWidth;
    const ro = new ResizeObserver(() => {
      if(!stage.isConnected){ ro.disconnect(); return; }
      if(Math.abs(stage.clientWidth - lastW) < 2) return;
      lastW = stage.clientWidth;
      layoutLadder(stage);
      const c = stage.querySelector('.dl-climber'); if(c) c.classList.remove('show');
      const cr = stage.querySelector('.dl-crown'); if(cr) cr.classList.remove('show');
    });
    ro.observe(stage);
  });
  root.querySelectorAll('[data-dl-toggle]').forEach(h => {
    h.addEventListener('click', () => {
      const sec = document.getElementById('dlSec_' + h.getAttribute('data-dl-toggle'));
      if(!sec) return;
      toggleSubsection(sec);
      if(!sec.classList.contains('collapsed')){
        const st = sec.querySelector('[data-ladder]');
        if(st) setTimeout(() => playLadder(st), 120);
      }
    });
  });
}

function buildPlayerSections(player){
  const t = I18N[currentLang];
  const recs = collectPlayerRecords(player);

  const groupLabel = (k) => k === 'levels' ? t.tabMain
    : k === 'futureLevels' ? t.tabFuture
    : k === 'nonListedLevels' ? t.tabNonListed
    : t.recGroupOther;
  const GROUP_DOT = { levels: 'g-main', futureLevels: 'g-future', nonListedLevels: 'g-non', other: 'g-other' };

  // уровни группируются по листам и выводятся плитками-чипами
  const groups = [];
  recs.forEach(r => {
    let g = groups.find(x => x.key === r.listKey);
    if(!g){ g = { key: r.listKey, items: [] }; groups.push(g); }
    g.items.push(r);
  });

  const chipHtml = (r) => {
    const isFull = String(r.percent).trim() === '100';
    const pending = (r.listKey === 'futureLevels');
    return `<span class="lvl-chip${isFull && !pending ? '' : ' partial'}${pending ? ' pending' : ''}"
        data-list="${escapeHtml(r.listKey)}" data-idx="${r.lvlIdx === null ? '' : r.lvlIdx}" role="button" tabindex="0">
      ${r.position ? `<b class="chip-rank">#${r.position}</b>` : ''}
      <span class="chip-name">${escapeHtml(r.levelName)}</span>
      ${(isFull && !pending) ? '<span class="chip-ver" title="100%">✔</span>' : ''}
      ${isFull ? '' : `<span class="chip-pct">${escapeHtml(r.percent)}%</span>`}
    </span>`;
  };

  const recItems = groups.map(g => {
    const chips = g.items.map(chipHtml).join('');
    return `<div class="lvl-group">
      <div class="lvl-group-head">
        <span class="lvl-group-title"><i class="g-dot ${GROUP_DOT[g.key] || 'g-other'}"></i>${escapeHtml(groupLabel(g.key))}</span>
        <span class="lvl-group-count">${g.items.length}</span>
      </div>
      <div class="lvl-chips">${chips}</div>
    </div>`;
  }).join('');

  // самый сложный — пройденный уровень классического листа с наименьшим номером
  const hardest = recs
    .filter(r => r.listKey === 'levels' && r.position && String(r.percent).trim() === '100')
    .sort((a, b) => a.position - b.position)[0];

  const hardestHtml = hardest
    ? `<div class="pr-hardest" data-list="levels" data-idx="${hardest.lvlIdx}" role="button" tabindex="0">
         <div class="pr-hardest-head"><span class="ph-ico">🔥</span>${escapeHtml(t.hardestTitle)}</div>
         <div class="pr-hardest-body">
           <span class="ph-rank">#${hardest.position}</span>
           <span class="ph-name">${escapeHtml(hardest.levelName)}</span>
           <span class="ph-go">›</span>
         </div>
       </div>`
    : '';

  // уровни, где игрок значится верификатором
  // засчитываем верификации только по классическому листу
  const verified = recs.filter(r => r.isVerifier && r.listKey === 'levels');
  const verifiedHtml = verified.length
    ? `<div class="detail-subsection pr-verified" id="playerVerifiedSection">
         <div class="subsection-header" id="playerVerifiedHeader">
           <span class="sh-icon">✅</span>
           <span class="sh-title">${escapeHtml(t.verifiedTitle)}</span>
           <span class="lvl-group-count">${verified.length}</span>
           <span class="sh-chevron">▲</span>
         </div>
         <div class="subsection-body">
           <div class="subsection-inner">
             <div class="subsection-list">
               <div class="lvl-chips is-verified">${verified.map(chipHtml).join('')}</div>
             </div>
           </div>
         </div>
       </div>`
    : '';

  const recordsBody = recs.length
    ? `<div class="subsection-inner">
         <div class="subsection-list">${recItems}</div>
       </div>`
    : `<div class="subsection-inner">
         <div class="pr-empty">
           <div class="pr-empty-ico">🏆</div>
           <div>${escapeHtml(t.noRecordsYet)}</div>
         </div>
       </div>`;

  const ladder = ladderHtml(player, String(player.id || 'x').replace(/[^\w-]/g, '') + '_' + Math.random().toString(36).slice(2, 6));
  return { hardestHtml, recordsBody, verifiedHtml, ladder };
}

// картинка ужимается до 192px и хранится прямо в JSON (~10–20 КБ)
function fileToAvatar(file){
  return new Promise((resolve, reject) => {
    if(!file || !/^image\//.test(file.type)) return reject(new Error('not an image'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        const S = 192, c = document.createElement('canvas');
        c.width = S; c.height = S;
        const ctx = c.getContext('2d');
        const side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindProfileSettings(player){
  const t = I18N[currentLang];
  const box = document.getElementById('prSettings');
  if(!box) return;
  let pending = player.avatar || '';
  const preview = document.getElementById('psAvaPreview');
  const err = document.getElementById('psErr');
  const showPreview = () => { preview.innerHTML = avatarInner({ name: player.name, avatar: pending }); };

  const drop = document.getElementById('psDrop');
  const takeFile = async (file) => {
    err.textContent = '';
    try{
      pending = await fileToAvatar(file);
      document.getElementById('psAvaUrl').value = '';
      showPreview();
      drop.classList.remove('pulse'); void drop.offsetWidth; drop.classList.add('pulse');
    }catch(ex){ err.textContent = t.profAvatarErr; }
  };
  drop.addEventListener('click', () => document.getElementById('psFile').click());
  drop.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); document.getElementById('psFile').click(); } });
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('is-over');
    if(e.dataTransfer.files && e.dataTransfer.files[0]) takeFile(e.dataTransfer.files[0]);
  });
  document.getElementById('psFile').addEventListener('change', async (e) => {
    await takeFile(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('psAvaUrl').addEventListener('input', (e) => {
    const v = e.target.value.trim();
    if(v){ pending = v; showPreview(); }
  });
  document.getElementById('psRemoveAva').addEventListener('click', () => {
    pending = ''; document.getElementById('psAvaUrl').value = ''; showPreview();
  });
  // ── свои ачивки ──
  const achList = document.getElementById('psAchList') || document.createElement('div');
  let lastIconInput = null;
  const achRow = (a = {}) => {
    const row = document.createElement('div');
    row.className = 'ps-ach-row';
    row.innerHTML = `
      <input type="text" class="ps-ach-icon" maxlength="4" value="${escapeHtml(a.icon || '🏅')}" aria-label="icon" />
      <input type="text" class="ps-ach-title" maxlength="28" placeholder="${escapeHtml(t.achCustomNamePh)}" value="${escapeHtml(a.title || '')}" />
      <input type="text" class="ps-ach-desc" maxlength="80" placeholder="${escapeHtml(t.achCustomDescPh)}" value="${escapeHtml(a.desc || '')}" />
      <button type="button" class="ps-mini ps-dl-del" title="✕">✕</button>`;
    const ic = row.querySelector('.ps-ach-icon');
    ic.addEventListener('focus', () => { lastIconInput = ic; });
    row.querySelector('.ps-dl-del').addEventListener('click', () => {
      row.classList.add('leaving'); setTimeout(() => row.remove(), 220);
    });
    return row;
  };
  (Array.isArray(player.achievements) ? player.achievements : []).forEach(a => achList.appendChild(achRow(a)));
  const achAddBtn = document.getElementById('psAchAdd');
  if(achAddBtn) achAddBtn.addEventListener('click', () => {
    const r = achRow(); r.classList.add('entering'); achList.appendChild(r);
    lastIconInput = r.querySelector('.ps-ach-icon');
    r.querySelector('.ps-ach-title').focus();
  });
  // быстрый выбор эмодзи — в последнее активное поле значка
  document.querySelectorAll('#psAchPresets .ps-ach-emoji').forEach(b => b.addEventListener('click', () => {
    const target = (lastIconInput && lastIconInput.isConnected) ? lastIconInput : achList.querySelector('.ps-ach-icon:last-of-type');
    const inp = target || (achList.lastElementChild && achList.lastElementChild.querySelector('.ps-ach-icon'));
    if(!inp) return;
    inp.value = b.dataset.e;
    inp.classList.remove('flash'); void inp.offsetWidth; inp.classList.add('flash');
  }));
  const collectAchievements = () => [...achList.children].map(r => ({
    icon: r.querySelector('.ps-ach-icon').value.trim().slice(0, 4) || '🏅',
    title: r.querySelector('.ps-ach-title').value.trim().slice(0, 28),
    desc: r.querySelector('.ps-ach-desc').value.trim().slice(0, 80),
  })).filter(a => a.title);

  // ── лестница: строки ступеней ──
  const dlList = document.getElementById('psDlList');
  const dlRow = (st = {}) => {
    const row = document.createElement('div');
    row.className = 'ps-dl-row';
    const status = ['done','cur','goal'].includes(st.status) ? st.status : 'goal';
    row.innerHTML = `
      <span class="ps-dl-num"></span>
      <input type="text" class="ps-dl-name" list="psDlLevels" placeholder="${escapeHtml(t.dlNamePh)}" value="${escapeHtml(st.name || '')}" />
      <select class="ps-dl-status">
        <option value="done"${status === 'done' ? ' selected' : ''}>${escapeHtml(t.dlDone)}</option>
        <option value="cur"${status === 'cur' ? ' selected' : ''}>${escapeHtml(t.dlCur)}</option>
        <option value="goal"${status === 'goal' ? ' selected' : ''}>${escapeHtml(t.dlGoal)}</option>
      </select>
      <input type="text" class="ps-dl-prog" placeholder="${escapeHtml(t.dlProgPh)}" value="${escapeHtml(st.progress || '')}" />
      <div class="ps-dl-ctrls">
        <button type="button" class="ps-mini" data-act="up" title="↑">↑</button>
        <button type="button" class="ps-mini" data-act="down" title="↓">↓</button>
        <button type="button" class="ps-mini ps-dl-del" data-act="del" title="✕">✕</button>
      </div>
      <input type="text" class="ps-dl-note" placeholder="${escapeHtml(t.dlNotePh)}" value="${escapeHtml(st.note || '')}" maxlength="160" />`;
    const syncProg = () => {
      const v = row.querySelector('.ps-dl-status').value;
      row.querySelector('.ps-dl-prog').disabled = (v !== 'cur');
      row.dataset.status = v;
    };
    row.querySelector('.ps-dl-status').addEventListener('change', syncProg);
    row.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
      const act = b.getAttribute('data-act');
      if(act === 'del'){ row.classList.add('leaving'); setTimeout(() => { row.remove(); renumber(); }, 220); return; }
      if(act === 'up' && row.previousElementSibling) dlList.insertBefore(row, row.previousElementSibling);
      if(act === 'down' && row.nextElementSibling) dlList.insertBefore(row.nextElementSibling, row);
      renumber();
    }));
    syncProg();
    return row;
  };
  const renumber = () => [...dlList.children].forEach((r, i) => { r.querySelector('.ps-dl-num').textContent = i + 1; });
  (player.ladder && Array.isArray(player.ladder.steps) ? player.ladder.steps : []).forEach(st => dlList.appendChild(dlRow(st)));
  renumber();
  document.getElementById('psDlAdd').addEventListener('click', () => {
    const r = dlRow(); r.classList.add('entering'); dlList.appendChild(r); renumber();
    r.querySelector('.ps-dl-name').focus();
  });
  const collectLadder = () => ({
    visible: document.getElementById('psDlVisible').checked,
    steps: [...dlList.children].map(r => ({
      name: r.querySelector('.ps-dl-name').value.trim(),
      status: r.querySelector('.ps-dl-status').value,
      progress: r.querySelector('.ps-dl-status').value === 'cur' ? parseProgress(r.querySelector('.ps-dl-prog').value) : '',
      note: r.querySelector('.ps-dl-note').value.trim().slice(0, 160),
    })).filter(st => st.name),
  });

  const bio = document.getElementById('psBio');
  bio.addEventListener('input', () => {
    const n = bio.value.length;
    document.getElementById('psBioCount').textContent = n;
    document.getElementById('psMeter').style.width = Math.round(n / 3) + '%';
    const v = bio.value.trim();
    document.getElementById('psPreview').innerHTML = bioCard(v || t.profBioPh, !v);
  });

  document.getElementById('psSave').addEventListener('click', async () => {
    const v = document.getElementById('psAvaUrl').value.trim();
    if(v && !/^https?:\/\//i.test(v)){ err.textContent = t.profUrlErr; return; }
    const saveBtn = document.getElementById('psSave');
    const b = bio.value.trim().slice(0, 300);
    const lad = collectLadder();
    const fields = { avatar: pending || null, bio: b || null, ladder: lad.steps.length ? lad : null };

    // у игрока есть аккаунт — профиль хранится в его строке profiles
    const row = profilesByNick.get(String(player.name || '').trim().toLowerCase());
    if(row && row.id){
      saveBtn.disabled = true;
      try{
        await refreshSessionIfNeeded();
        const res = await fetch(`${PROFILES_REST}?id=eq.${encodeURIComponent(row.id)}`, {
          method: 'PATCH', headers: { ...authHeaders(), Prefer: 'return=representation' }, body: JSON.stringify(fields),
        });
        const out = await res.json().catch(() => []);
        if(!res.ok || !out.length){ err.textContent = t.profSaveDenied; saveBtn.disabled = false; return; }
        Object.assign(row, out[0]);
      }catch(e){ err.textContent = t.profSaveDenied; saveBtn.disabled = false; return; }
    }

    // в общем JSON: для игроков без аккаунта (правит админ) и для своих ачивок
    const target = (state.players || []).find(p => String(p.id) === String(player.id));
    if(target){
      if(fields.avatar) target.avatar = fields.avatar; else delete target.avatar;
      if(fields.bio) target.bio = fields.bio; else delete target.bio;
      if(fields.ladder) target.ladder = fields.ladder; else delete target.ladder;
      if(isAdmin){
        const achs = collectAchievements();
        if(achs.length) target.achievements = achs; else delete target.achievements;
        saveLevels();
      }
    } else {
      Object.assign(player, fields);
    }
    render();               // список и пьедестал под профилем тоже должны обновиться
    renderPlayerProfile();
  });
  document.getElementById('psCancel').addEventListener('click', () => toggleProfileSettings(false));
  const bk = document.getElementById('backupBtn');
  if(bk) bk.addEventListener('click', downloadBackup);
}

function toggleProfileSettings(force){
  const wrap = document.getElementById('prSettingsWrap');
  const gear = document.getElementById('prSettingsBtn');
  if(!wrap) return;
  const open = (force === undefined) ? !wrap.classList.contains('is-open') : force;
  wrap.classList.toggle('is-open', open);
  if(gear) gear.classList.toggle('menu-open', open);
  if(open) setTimeout(() => wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
}

function toggleSubsection(el){
  const body = el.querySelector('.subsection-body');
  const inner = body ? body.querySelector('.subsection-inner') : null;
  if(!body || !inner){ el.classList.toggle('collapsed'); return; }

  if(body._anim){ body._anim.cancel(); body._anim = null; }

  const expanding = el.classList.contains('collapsed');
  el.classList.toggle('collapsed');   // CSS держит финальное состояние

  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if(typeof body.animate !== 'function') return;   // старые браузеры — просто без анимации

  const full = inner.scrollHeight;
  const frames = expanding
    ? [{ height: '0px', opacity: 0 }, { height: full + 'px', opacity: 1 }]
    : [{ height: full + 'px', opacity: 1 }, { height: '0px', opacity: 0 }];

  body._anim = body.animate(frames, {
    duration: 340,
    easing: 'cubic-bezier(.16,1,.3,1)'
  });
  body._anim.onfinish = () => { body._anim = null; };
}

const DIFFICULTIES = { insane: 'Insane Demon', extreme: 'Extreme Demon' };
const DIFF_ICON = { insane: '👹', extreme: '😈' };

function positionChartHtml(lvl, idx, t){
  const pts = buildHistoryEntries(lvl, idx, t)
    .map(e => ({ date: e.date, pos: Number(e.position) }))
    .filter(e => e.pos > 0 && e.date)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
  if(pts.length < 2) return '';
  const diff = pts[0].pos - pts[pts.length - 1].pos;
  const trend = diff > 0 ? `<span class="lv-up">▲ ${diff}</span>` : diff < 0 ? `<span class="lv-down">▼ ${-diff}</span>` : '<span>•</span>';
  const first = pts[0], last = pts[pts.length - 1];
  return `<div class="lv-card lv-chart" style="--d:.45s">
    <div class="lv-lab"><span>${escapeHtml(t.positionHistoryTitle)}</span><span>${trend} ${escapeHtml(t.lvSinceAdded)}</span></div>
    <div class="lv-plot" data-pts='${escapeHtml(JSON.stringify(pts))}'></div>
    <div class="lv-axis"><span>${escapeHtml(fmtEuDate(first.date))}</span><span class="lv-now">${escapeHtml(fmtEuDate(last.date))}</span></div>
  </div>`;
}

function fmtEuDate(d){
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : String(d);
}

// график строится в реальных пикселях — без растяжения точки остаются кругами
function drawPositionChart(plot, animate){
  let pts; try{ pts = JSON.parse(plot.getAttribute('data-pts')); }catch(e){ return; }
  const W = Math.max(200, plot.clientWidth), H = 150;
  const L = 34, R = 14, T = 16, B = 14;
  const minP = Math.min(...pts.map(p => p.pos)), maxP = Math.max(...pts.map(p => p.pos));
  const span = Math.max(1, maxP - minP);
  // выше — лучше: меньший номер места наверху
  const X = (i) => L + (W - L - R) * (i / (pts.length - 1));
  const Y = (pos) => T + (H - T - B) * ((pos - minP) / span);
  const xy = pts.map((p, i) => ({ x: X(i), y: Y(p.pos), ...p }));

  // плавная кривая без «перелётов» за точки (монотонная интерполяция)
  const n = xy.length, dx = [], dy = [], m = [], tan = [];
  for(let i = 0; i < n - 1; i++){ dx[i] = xy[i + 1].x - xy[i].x; dy[i] = xy[i + 1].y - xy[i].y; m[i] = dy[i] / dx[i]; }
  tan[0] = m[0]; tan[n - 1] = m[n - 2];
  for(let i = 1; i < n - 1; i++) tan[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
  let d = `M${xy[0].x.toFixed(1)} ${xy[0].y.toFixed(1)}`;
  for(let i = 0; i < n - 1; i++){
    const c1x = xy[i].x + dx[i] / 3, c1y = xy[i].y + tan[i] * dx[i] / 3;
    const c2x = xy[i + 1].x - dx[i] / 3, c2y = xy[i + 1].y - tan[i + 1] * dx[i] / 3;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${xy[i + 1].x.toFixed(1)} ${xy[i + 1].y.toFixed(1)}`;
  }
  const area = `${d} L${xy[n - 1].x.toFixed(1)} ${H} L${xy[0].x.toFixed(1)} ${H} Z`;

  // подписи мест слева: лучшее, худшее и середина
  const ticks = [...new Set([minP, Math.round((minP + maxP) / 2), maxP])];
  const many = n > 7;
  const ptR = many ? 3 : 3.8;

  plot.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="lv-svg${animate ? ' anim' : ''}" aria-hidden="true">
    <defs>
      <linearGradient id="lvLine" x1="0" x2="1"><stop offset="0" stop-color="#b06cf0"/><stop offset="1" stop-color="#e4ff5c"/></linearGradient>
      <linearGradient id="lvFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b06cf0" stop-opacity=".22"/><stop offset="1" stop-color="#b06cf0" stop-opacity="0"/></linearGradient>
    </defs>
    <g class="lv-grid">${ticks.map(p => `<line x1="${L}" x2="${W - R}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}"/><text x="${L - 8}" y="${(Y(p) + 4).toFixed(1)}" text-anchor="end">#${p}</text>`).join('')}</g>
    <path class="lv-area" d="${area}" fill="url(#lvFill)"/>
    <path class="lv-line" d="${d}" fill="none" stroke="url(#lvLine)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
    ${xy.map((p, i) => {
      const lastPt = i === n - 1;
      return `<g class="lv-pt-g" style="--i:${i}">
        <circle class="lv-hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="12"/>
        <circle class="lv-pt${lastPt ? ' last' : ''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${lastPt ? 5 : ptR}"/>
        <g class="lv-tip" transform="translate(${Math.min(Math.max(p.x, L + 40), W - R - 40).toFixed(1)} ${(p.y < 40 ? p.y + 26 : p.y - 16).toFixed(1)})">
          <rect x="-40" y="-14" width="80" height="22" rx="7"/>
          <text y="1" text-anchor="middle">#${p.pos} · ${escapeHtml(fmtEuDate(p.date).slice(0, 5))}</text>
        </g>
      </g>`;
    }).join('')}
  </svg>`;
}

function initPositionCharts(root){
  root.querySelectorAll('.lv-plot').forEach(plot => {
    drawPositionChart(plot, true);
    let w = plot.clientWidth;
    const ro = new ResizeObserver(() => {
      if(!plot.isConnected){ ro.disconnect(); return; }
      if(Math.abs(plot.clientWidth - w) < 2) return;
      w = plot.clientWidth;
      drawPositionChart(plot, false);
    });
    ro.observe(plot);
  });
}

function beatenByHtml(lvl, cfg, t){
  const full = parseRecordEntries(lvl).filter(r => String(r.percent).trim() === '100').map(r => String(r.player).trim());

  const verifiers = (cfg.key !== 'futureLevels') ? String(lvl.verifier || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean) : [];
  const seen = new Set();
  const names = [...verifiers, ...full].filter(n => { const k = n.toLowerCase(); if(!n || seen.has(k)) return false; seen.add(k); return true; });
  if(!names.length && !total) return '';
  const players = Array.isArray(state.players) ? state.players : [];
  const SHOW = 7;
  const avas = names.slice(0, SHOW).map((n, i) => {
    const pl = players.find(p => String(p.name).trim().toLowerCase() === n.toLowerCase());
    const inner = pl ? avatarInner(pl) : escapeHtml((n.charAt(0) || '?').toUpperCase());
    return `<button class="lv-ava${pl && pl.avatar ? ' has-img' : ''}" data-player="${escapeHtml(n)}" style="--i:${i}" title="${escapeHtml(n)}">${inner}</button>`;
  }).join('');
  const more = names.length > SHOW ? `<span class="lv-ava lv-more" style="--i:${SHOW}">+${names.length - SHOW}</span>` : '';
  const partial = Math.max(0, total - full.length);
  const fullN = full.length;
  return `<div class="lv-card lv-beaten" style="--d:.55s">
    <div class="lv-lab"><span>${escapeHtml(t.lvBeatenBy)}</span><span>${names.length}</span></div>
    <div class="lv-avas">${avas}${more || ''}${names.length ? '' : `<span class="lv-empty">${escapeHtml(t.lvNobody)}</span>`}</div>
    ${total ? `<div class="lv-lab lv-lab2"><span>${escapeHtml(t.recordsTitle)}</span><span>${total}</span></div>
    <div class="lv-split"><i class="lv-split-full" data-w="${(fullN / total * 100).toFixed(1)}"></i><i class="lv-split-part" data-w="${(partial / total * 100).toFixed(1)}"></i></div>
    <div class="lv-legend"><span class="k-full">100% · ${fullN}</span><span class="k-part">${escapeHtml(t.lvProgress)} · ${partial}</span></div>` : ''}
  </div>`;
}

/* ── уведомления ────────────────────────────────────────────
   создаются при сохранении уровня: новый/изменённый рекорд игрока
   и новая верификация. Адресат — ник игрока. */
const NOTIF_LIMIT = 300;
const nickKey = (n) => String(n || '').trim().toLowerCase();

function splitNicks(v){
  return String(v || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
}

function emitLevelNotifications(before, lvl, listKey){
  if(!Array.isArray(state.notifications)) state.notifications = [];
  const now = Date.now();
  const author = currentAdminNick || '';
  const add = (n) => state.notifications.unshift({ id: uid(), at: now, read: false, by: author, level: lvl.name, list: listKey, ...n });

  // рекорды: новые или с изменившимся процентом
  const oldRecs = new Map(parseRecordEntries({ records: before.records || '' })
    .map(r => [nickKey(r.player), String(r.percent).trim()]));
  parseRecordEntries(lvl).forEach(r => {
    const k = nickKey(r.player);
    if(!k) return;
    const pc = String(r.percent).trim();
    if(oldRecs.get(k) === pc) return;
    add({ to: k, type: 'record', percent: pc });
  });

  // верификация: ник, которого раньше не было в поле
  // в будущем листе верификатор только назначен — уведомлять рано
  if(listKey !== 'futureLevels'){
    const oldV = new Set(splitNicks(before.verifier).map(nickKey));
    splitNicks(lvl.verifier).forEach(v => {
      const k = nickKey(v);
      if(!oldV.has(k)) add({ to: k, type: 'verify' });
    });
  }

  if(state.notifications.length > NOTIF_LIMIT) state.notifications.length = NOTIF_LIMIT;
}

function myNotifications(){
  const me = nickKey(currentAdminNick);
  if(!me || !Array.isArray(state.notifications)) return [];
  return state.notifications.filter(n => n.to === me && !isNotifHidden(n));
}

function updateNotifBadge(){
  const btn = document.getElementById('notifBtn');
  if(!btn) return;
  const unread = myNotifications().filter(n => !isNotifRead(n)).length;
  let dot = btn.querySelector('.notif-dot');
  btn.classList.toggle('has-unread', unread > 0);
  if(unread){
    const label = unread > 9 ? '9+' : String(unread);
    if(!dot){ dot = document.createElement('span'); dot.className = 'notif-dot pop'; btn.appendChild(dot); }
    else if(dot.textContent !== label){ dot.classList.remove('pop'); void dot.offsetWidth; dot.classList.add('pop'); }
    dot.textContent = label;
  } else if(dot){
    dot.classList.add('out');
    setTimeout(() => dot.remove(), 250);
  }
}

function relTime(ts){
  const rtf = new Intl.RelativeTimeFormat(currentLang === 'ru' ? 'ru' : 'en', { numeric: 'auto' });
  const sec = Math.round((ts - Date.now()) / 1000);
  const steps = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
  for(const [unit, size] of steps){
    if(Math.abs(sec) >= size) return rtf.format(Math.round(sec / size), unit);
  }
  return currentLang === 'ru' ? 'только что' : 'just now';
}

function notifText(n, t){
  const lvl = escapeHtml(n.level || '');
  if(n.type === 'verify'){
    return { title: t.nVerifyTitle, body: t.nVerifyBody.replace('{lvl}', `<b>${lvl}</b>`) };
  }
  const full = String(n.percent) === '100';
  return {
    title: t.nRecordTitle,
    body: (full ? t.nRecordBodyFull : t.nRecordBodyPart)
      .replace('{lvl}', `<b>${lvl}</b>`).replace('{pc}', escapeHtml(String(n.percent))),
  };
}

function isNotifRead(n){
  if(currentUser && currentUser.readNotifs) return currentUser.readNotifs.has(n.id) || currentUser.readNotifs.has('x:' + n.id);

}
function isNotifHidden(n){

/* ── страница правил ─────────────────────────────────────── */
// правила по умолчанию берутся из I18N, отредактированные — из state.rules[lang]
function defaultRules(lang){
  const t = I18N[lang];
  return {
    title: t.rulesTitle,
    sub: t.rulesSub,
    note: t.rulesNote,
    blocks: [
      { icon: '🎬', title: t.rulesSubmitH, items: t.rulesSubmit.slice() },
      { icon: '🏆', title: t.rulesListH,   items: t.rulesList.slice() },
      { icon: '✦',  title: t.rulesPtsH,    items: t.rulesPts.slice() },
    ],
  };
}
function getRules(lang){
  const custom = state.rules && state.rules[lang];
  if(custom && Array.isArray(custom.blocks)) return custom;
  return defaultRules(lang);
}

// правила редактируются как обычный текст: «# Заголовок» — блок, остальные строки — пункты
function rulesToText(r){
  const head = [r.title || '', r.sub || ''].join('\n');
  const body = (r.blocks || []).map(b =>
    `# ${b.title}\n` + (b.items || []).join('\n')
  ).join('\n\n');
  return `${head}\n\n${body}\n\n> ${r.note || ''}`;
}
function textToRules(txt, lang){
  const lines = String(txt).replace(/\r/g, '').split('\n');
  const base = defaultRules(lang);
  const out = { title: '', sub: '', note: '', blocks: [] };
  let cur = null, headCount = 0;
  lines.forEach(raw => {
    const line = raw.trim();
    if(!line) return;
    if(line.startsWith('#')){
      cur = { icon: (base.blocks[out.blocks.length] || {}).icon || '•', title: line.replace(/^#+\s*/, ''), items: [] };
      out.blocks.push(cur);
      return;
    }
    if(line.startsWith('>')){ out.note = line.replace(/^>\s*/, ''); return; }
    if(!cur){
      if(headCount === 0) out.title = line;
      else if(headCount === 1) out.sub = line;
      headCount++;
      return;
    }
    cur.items.push(line.replace(/^\d+[.)]\s*/, ''));
  });
  if(!out.title) out.title = base.title;
  if(!out.blocks.length) out.blocks = base.blocks;
  return out;
}

function getUpdatesRaw(lang){
  const u = state.updates && state.updates[lang];
  return Array.isArray(u) ? u : [];
}
// для показа: свои записи + записи другого языка с датами, которых в своём нет —
// новое обновление сразу видно на обоих языках, пока его не перевели
function getUpdates(lang){
  const other = lang === 'ru' ? 'en' : 'ru';
  const own = getUpdatesRaw(lang).map(e => ({ ...e, lang }));
  const seen = new Set(own.map(e => e.date));
  const missing = getUpdatesRaw(other).filter(e => !seen.has(e.date)).map(e => ({ ...e, lang: other, untranslated: true }));
  return [...own, ...missing].sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
function isPinned(date){
  return !!(state.updates && Array.isArray(state.updates.pinned) && state.updates.pinned.includes(date));
}
function togglePin(date){
  if(!state.updates || typeof state.updates !== 'object') state.updates = {};
  const set = new Set(Array.isArray(state.updates.pinned) ? state.updates.pinned : []);
  set.has(date) ? set.delete(date) : set.add(date);
  state.updates.pinned = [...set];
  saveLevels();
}

function updatesToText(list){
  return list.map(e =>
    `${e.date || ''} | ${e.title || ''}\n` + (e.items || []).map(x => `- ${x}`).join('\n')
  ).join('\n\n');
}

function textToUpdates(txt){
  const out = [];
  let cur = null;
  String(txt).replace(/\r/g, '').split('\n').forEach(raw => {
    const line = raw.trim();
    if(!line) return;
    if(line.startsWith('-') || line.startsWith('•')){
      if(cur) cur.items.push(line.replace(/^[-•]\s*/, ''));
      return;
    }
    const m = line.split('|');
    cur = { date: (m[0] || '').trim(), title: (m.slice(1).join('|') || '').trim(), items: [] };
    out.push(cur);
  });
  // свежие сверху
  out.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return out;
}

function authFail(msg){
  const card = document.getElementById('authCard');
  const err = document.getElementById('authErr');
  err.textContent = msg;
  err.classList.add('show');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}

async function onAuthSubmit(e){
  e.preventDefault();
  const t = I18N[currentLang];
  const nick = document.getElementById('auNick').value.trim();
  const pass = document.getElementById('auPass').value;
  const remember = document.getElementById('auRemember').checked;
  const up = authMode === 'up';
  document.getElementById('authErr').classList.remove('show');
  if(!NICK_RE.test(nick)) return authFail(t.auNickBad);
  if(!pass.length) return authFail(t.auPassShort);
  if(up && pass !== document.getElementById('auPass2').value) return authFail(t.auPassMismatch);
  if(!isConfigured()) return authFail(t.auNoServer);

  const btn = document.getElementById('auSubmit');
  btn.classList.add('loading'); btn.disabled = true;
  try{
    if(up) await signUp(nick, pass, remember);
    else await signIn(nick, pass, remember);
    const card = document.getElementById('authCard');
    document.getElementById('authOkTitle').textContent = (up ? t.auWelcomeNew : t.auWelcome).replace('{n}', currentAdminNick);
    document.getElementById('authOkSub').textContent = isAdmin ? t.auAdminNote : t.auPlayerNote;
    card.classList.add('done');
    setTimeout(() => { closeAuthPage(); }, 1500);
  }catch(ex){
    btn.classList.remove('loading'); btn.disabled = false;
    const code = String(ex && ex.code || '');
    const m = String(ex && ex.message || '');
    if(code === 'taken' || code === 'user_already_exists' || /already registered|already exists/i.test(m)) authFail(t.auNickTaken);
    else if(code === 'confirm' || code === 'email_not_confirmed') authFail(t.auConfirmOn);
    else if(code === 'signup_disabled' || /signups not allowed/i.test(m)) authFail(t.auSignupOff);
    else if(code === 'email_address_invalid' || /email address .* invalid/i.test(m)) authFail(t.auEmailRejected);
    else if(code === 'weak_password') authFail(t.auWeakServer);
    else if(!up && (code === 'invalid_credentials' || ex.status === 400 || /invalid login|invalid_grant/i.test(m))) authFail(t.auBadCreds);
    else if(ex.status === 429 || code === 'over_request_rate_limit') authFail(t.auTooMany);
    else if(ex.status) authFail(`${t.auServerSaid} ${m || ('HTTP ' + ex.status)}`);
    else authFail(t.auNetErr);
    console.warn('auth error', ex.status, code, m, ex.data);
  }
}

function openUpdatesPage(){
  syncMenuActive('updates');
  const t = I18N[currentLang];
  const list = getUpdates(currentLang);

  // тип изменения по первому слову пункта — для цветной метки
  const kindOf = (txt) => {
    const w = String(txt).trim().toLowerCase();
    if(/^(added|add|new|добав|нов)/.test(w)) return 'new';
    if(/^(fix|fixed|исправ|почин)/.test(w)) return 'fix';
    if(/^(remov|delet|убра|удал)/.test(w)) return 'del';
    return 'upd';
  };
  const KIND_LABEL = { new: t.updKindNew, fix: t.updKindFix, del: t.updKindDel, upd: t.updKindUpd };
  const fmtDate = (d) => {
    const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? `${m[3]}.${m[2]}.${m[1]}` : d;
  };
  const totalItems = list.reduce((n, e) => n + (e.items || []).length, 0);
  const latestTs = list.length ? Date.parse(list[0].date) : NaN;

  // закреплённые — наверх, остальные по дате; «последнее» — самое свежее по дате
  const latestDate = list.length ? list[0].date : null;
  const ordered = [...list.filter(e => isPinned(e.date)), ...list.filter(e => !isPinned(e.date))];
  const entries = ordered.map((e, idx) => {
    const items = e.items || [];
    const pinned = isPinned(e.date);
    const isLatest = e.date === latestDate;
    const counts = items.reduce((m, x) => { const k = kindOf(x); m[k] = (m[k] || 0) + 1; return m; }, {});
    const chips = ['new','fix','upd','del'].filter(k => counts[k])
      .map(k => `<span class="upd-count k-${k}">${counts[k]} ${escapeHtml(KIND_LABEL[k])}</span>`).join('');
    return `
    <article class="upd-card${isLatest ? ' is-latest' : ''}${pinned ? ' is-pinned' : ''}" style="--d:${0.08 + idx * 0.08}s">
      <span class="upd-node" aria-hidden="true">${pinned ? PIN_SVG : ''}</span>
      <header class="upd-card-head">
        <span class="upd-date-pill">${escapeHtml(fmtDate(e.date || ''))}</span>
        ${pinned ? `<span class="upd-pin-tag">${PIN_SVG}${escapeHtml(t.updPinned)}</span>` : ''}
        ${isLatest ? `<span class="upd-latest">${escapeHtml(t.updLatest)}</span>` : ''}
        ${e.untranslated ? `<span class="upd-untr" title="${escapeHtml(t.updUntranslatedHint)}">${e.lang.toUpperCase()}</span>` : ''}
        <span class="upd-counts">${chips}</span>
        ${isAdmin ? `<button class="upd-pin-btn${pinned ? ' on' : ''}" data-pin="${escapeHtml(e.date)}" title="${escapeHtml(pinned ? t.updUnpin : t.updPin)}" aria-label="${escapeHtml(pinned ? t.updUnpin : t.updPin)}">${PIN_SVG}</button>` : ''}
      </header>
      ${e.title ? `<h3 class="upd-card-title">${escapeHtml(e.title)}</h3>` : ''}
      ${items.length ? `<ul class="upd-list">${items.map((x, j) => {
        const k = kindOf(x);
        return `<li class="k-${k}" style="--i:${j}"><span class="upd-tag">${escapeHtml(KIND_LABEL[k])}</span><span class="upd-txt">${escapeHtml(x)}</span></li>`;
      }).join('')}</ul>` : ''}
    </article>`;
  }).join('');

  const hero = `
    <div class="upd-hero">
      <div class="upd-hero-glow" aria-hidden="true"></div>
      <div class="upd-hero-text">
        <div class="upd-eyebrow">${escapeHtml(t.updatesEyebrow)}</div>
        <div class="upd-hero-title">${escapeHtml(t.updatesTitle)}</div>
        <div class="upd-hero-sub">${escapeHtml(t.updatesSub)}</div>
      </div>
      <div class="upd-stats">
        <div class="upd-stat"><b>${list.length}</b><span>${escapeHtml(t.updStatReleases)}</span></div>
        <div class="upd-stat"><b>${totalItems}</b><span>${escapeHtml(t.updStatChanges)}</span></div>
        <div class="upd-stat"><b>${isNaN(latestTs) ? '—' : escapeHtml(relTime(latestTs))}</b><span>${escapeHtml(t.updStatLast)}</span></div>
      </div>
    </div>`;

  document.getElementById('updatesContent').innerHTML = `
    ${hero}
    ${list.length ? `<div class="upd-feed">${entries}</div>`
                  : `<div class="rules-note">${escapeHtml(t.updatesEmpty)}</div>`}
    ${isAdmin ? `<div class="rules-editor add-form open" id="updatesEditor" style="display:none;">
      <div class="form-title">${escapeHtml(t.rulesEdit)}</div>
      <label for="updatesTextarea">${escapeHtml(t.updatesTitle)}</label>
      <textarea id="updatesTextarea" spellcheck="false" rows="16"></textarea>
      <div class="rules-editor-hint">${escapeHtml(t.updatesEditHint)}</div>
      <div class="actions">
        <button class="primary" id="updatesSaveBtn">${escapeHtml(t.rulesSave)}</button>
        <button class="ghost" id="updatesCancelBtn">${escapeHtml(t.rulesCancel)}</button>
      </div>
    </div>` : ''}`;

  document.querySelectorAll('#updatesContent .upd-pin-btn').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    b.classList.add('spin');
    togglePin(b.getAttribute('data-pin'));
    setTimeout(openUpdatesPage, 260);
  }));

  const slot = document.getElementById('updatesEditSlot');
  if(slot) slot.innerHTML = isAdmin
    ? `<button class="detail-back rules-edit-btn" id="updatesEditBtn">
         <span class="db-arrow">✎</span><span>${escapeHtml(t.rulesEdit)}</span>
       </button>`
    : '';

  if(isAdmin){
    const editor = document.getElementById('updatesEditor');
    const ta = document.getElementById('updatesTextarea');

      // свой язык пуст — подставляем записи с другого, чтобы осталось только перевести
      const own = getUpdatesRaw(currentLang);
      ta.value = updatesToText(own.length ? own : getUpdatesRaw(currentLang === 'ru' ? 'en' : 'ru'));
      editor.style.display = editor.style.display === 'none' ? '' : 'none';
      if(editor.style.display === ''){
        ta.focus();
        // подсказка с сегодняшней датой, если поле пустое
        if(!ta.value.trim()) ta.value = `${new Date().toISOString().slice(0, 10)} | \n- `;
      }
    });
    document.getElementById('updatesSaveBtn').addEventListener('click', () => {
      if(!state.updates || typeof state.updates !== 'object') state.updates = {};
      state.updates[currentLang] = textToUpdates(ta.value);
      saveLevels();
      openUpdatesPage();
    });
    document.getElementById('updatesCancelBtn').addEventListener('click', () => { editor.style.display = 'none'; });
  }

  const sbHide = document.getElementById('searchBar');
  if(sbHide) sbHide.style.display = 'none';
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('playerView').style.display = 'none';
  document.getElementById('notifView').style.display = 'none';
  document.getElementById('rulesView').style.display = 'none';
  const uv = document.getElementById('updatesView');
  uv.style.display = '';
  uv.classList.remove('page-in');
  void uv.offsetWidth;
  uv.classList.add('page-in');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ── переключатель видимости: элементы управления / галочки пройденных ── */
const CONTROLS_KEY = 'gll_hide_controls';
const VIS_MODES = ['none', 'controls', 'beaten', 'both', 'onlyBeaten'];
let visMode = 'none';
try{
  const raw = localStorage.getItem(CONTROLS_KEY);
  visMode = VIS_MODES.includes(raw) ? raw : (raw === '1' ? 'controls' : 'none');
}catch(e){}

function applyControlsVisibility(){
  const hideCtl = (visMode === 'controls' || visMode === 'both');
  const hideBt  = (visMode === 'beaten'   || visMode === 'both');
  document.body.classList.toggle('hide-row-controls', hideCtl);
  document.body.classList.toggle('hide-beaten', hideBt);
  document.body.classList.toggle('only-beaten', visMode === 'onlyBeaten');
  const btn = document.getElementById('toggleControlsBtn');
  if(btn){
    btn.classList.toggle('is-off', visMode !== 'none');
    const t = I18N[currentLang];
    const label = (visMode === 'none') ? t.hideControls : t.showControls;
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }
}

// триггеры меню гасят всплытие клика, поэтому «клик снаружи» у соседей не срабатывал
// и меню оставались открытыми одновременно — закрываем остальные явно
document.addEventListener('pointermove', (e) => {
  const tr = e.target.closest && e.target.closest('.nav-trigger, .lang-trigger, #siteHeader .icon-btn, #adminLoginOpenBtn');
  if(!tr) return;
  const r = tr.getBoundingClientRect();
  tr.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
}, { passive: true });

function closeAllMenus(except){
  ['listsMenu', 'moreMenu', 'langMenu'].forEach(id => {
    if(id === except) return;
    const el = document.getElementById(id);
    if(el) el.classList.remove('open');
  });
  if(except !== 'visMenu' && document.getElementById('visMenu')) closeVisMenu();
}

function closeVisMenu(){
  const m = document.getElementById('visMenu');
  const btn = document.getElementById('toggleControlsBtn');
  if(btn) btn.classList.remove('menu-open');
  document.removeEventListener('click', onVisOutside, true);
  if(!m) return;
  m.id = '';                       // повторный клик откроет новое меню, пока старое гаснет
  m.classList.remove('open');
  setTimeout(() => m.remove(), 260);
}
function onVisOutside(e){
  const m = document.getElementById('visMenu');
  const btn = document.getElementById('toggleControlsBtn');
  if(m && !m.contains(e.target) && btn && !btn.contains(e.target)) closeVisMenu();
}

document.getElementById('toggleControlsBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if(document.getElementById('visMenu')){ closeVisMenu(); return; }
  closeAllMenus('visMenu');
  const t = I18N[currentLang];
  const btn = e.currentTarget;
  const menu = document.createElement('div');
  menu.className = 'vis-menu';
  menu.id = 'visMenu';
  menu.innerHTML = [
    ['none', t.visNone], ['controls', t.visControls],
    ['beaten', t.visBeaten], ['both', t.visBoth], ['onlyBeaten', t.visOnlyBeaten],
  ].map(([mode, label]) =>
    `<button data-mode="${mode}" class="tab-btn${visMode === mode ? ' active' : ''}">${label}</button>`
  ).join('');
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect();

  if(!fName.value.trim()){

  }
  const arr = getArr();
  const detailValues = {
    creator: fCreator.value.trim(),
    thumbnail: fThumb.value.trim(),
    videoUrl: fVideo.value.trim(),
    description: fDesc.value.trim(),
    levelId: fLevelId.value.trim(),
    password: fPassword.value.trim(),
    length: fLength.value.trim(),
    objects: fObjects.value.trim(),
    version: fVersion.value.trim(),
    historyExtra: fHistoryExtra.value.trim(),
    records: fRecords.value.trim(),
  };
  // снимок до правки — по нему видно, какие рекорды и верификации появились
  const beforeLvl = editingId ? arr.find(l => l.id === editingId) : null;
  const beforeSnap = beforeLvl ? { verifier: beforeLvl.verifier, records: beforeLvl.records } : { verifier: '', records: '' };

  if(editingId){
    const lvl = arr.find(l => l.id === editingId);
    if(lvl){
      lvl.name = fName.value.trim();
      lvl.verifier = fVerifier.value.trim();
      lvl.extra = fExtra.value.trim();
      if(fDifficultyValue) lvl.difficulty = fDifficultyValue; else delete lvl.difficulty;
      if(fIsNew.checked){
        if(!lvl.isNew) lvl.newAt = Date.now();   // отсчёт двух недель с момента включения
        lvl.isNew = true;
      } else {
        delete lvl.isNew; delete lvl.newAt;
      }
      if(cfg.metaKind === 'progress') lvl.progress = parseProgress(fPoints.value);
      else lvl.points = Number(fPoints.value) || 0;
      Object.assign(lvl, detailValues);
    }
  } else {
    arr.push({
      id: uid(),
      ...(fIsNew.checked ? { isNew: true, newAt: Date.now() } : {}),
      name: fName.value.trim(),
      verifier: fVerifier.value.trim(),
      extra: fExtra.value.trim(),
      ...(fDifficultyValue ? { difficulty: fDifficultyValue } : {}),
      ...(cfg.metaKind === 'progress'
        ? { points: 0, progress: parseProgress(fPoints.value) }
        : { points: Number(fPoints.value) || 0 }),
      ...detailValues,
    });
  }
  if(cfg.autoRecalc) recalcPoints(arr);
  const afterLvl = editingId ? arr.find(l => l.id === editingId) : arr[arr.length - 1];
  if(afterLvl && currentTab !== 'players') emitLevelNotifications(beforeSnap, afterLvl, cfg.key);
  closeForm();
  render();
  saveLevels();
  updateNotifBadge();
});

<script>
/* ════════ GLOBAL BACKGROUND PARTICLES ════════ */
(function(){
  const c = document.getElementById('bgParticles');
  if(!c) return;
  const ctx = c.getContext('2d');
  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  const COLORS = ['#e4ff5c','#b06cf0','#5cf0e4','#ffd66b'];
  let dots = [];
  const N = window.innerWidth < 640 ? 34 : 60;

  function resize(){
    W = c.width = innerWidth * DPR;
    H = c.height = innerHeight * DPR;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
  }
  function seed(){
    dots = Array.from({length:N}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.18*DPR, vy: (Math.random()-0.5)*0.18*DPR,
      r: (Math.random()*1.8 + 0.6)*DPR,
      col: COLORS[(Math.random()*COLORS.length)|0],
      a: Math.random()*0.5 + 0.15,
      tw: Math.random()*Math.PI*2
    }));
  }
  function tick(t){
    ctx.clearRect(0,0,W,H);
    for(const d of dots){
      d.x += d.vx; d.y += d.vy; d.tw += 0.02;
      if(d.x < 0) d.x = W; if(d.x > W) d.x = 0;
      if(d.y < 0) d.y = H; if(d.y > H) d.y = 0;
      const alpha = d.a * (0.6 + 0.4*Math.sin(d.tw));
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = d.col;
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 8*DPR; ctx.shadowColor = d.col;
      ctx.fill();
    }
    // connect close dots
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    for(let a=0;a<dots.length;a++){
      for(let b=a+1;b<dots.length;b++){
        const dx = dots[a].x-dots[b].x, dy = dots[a].y-dots[b].y;
        const dist = Math.hypot(dx,dy);
        if(dist < 120*DPR){
          ctx.strokeStyle = 'rgba(176,108,240,'+ (0.12*(1-dist/(120*DPR))) +')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(dots[a].x,dots[a].y); ctx.lineTo(dots[b].x,dots[b].y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  const reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  resize(); seed();
  if(!reduced) requestAnimationFrame(tick);
  else { /* draw one static frame */ tick(0); }
  addEventListener('resize', () => { resize(); seed(); });
})();

/* ════════ PER-ROW TOP-3 PARTICLES ════════ */
const ROW_FX = new WeakMap();  // row -> { burst(x,y), excite() }
function startRowParticles(canvas, rankIdx){
  const reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const palette = [
    ['#ffd66b','#fff0b0','#ffe89a'],  // gold
    ['#d8dbe8','#ffffff','#c9cce0'],  // silver
    ['#ff9d5c','#ffd0a8','#ffb87a']   // bronze
  ][rankIdx] || ['#e4ff5c'];
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let w, h, parts = [], raf, running = true, energy = 0;
  const AMBIENT = rankIdx === 0 ? 20 : 13;

  function size(){
    const r = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = r.width * DPR;
    h = canvas.height = r.height * DPR;
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
  }
  function ambient(){
    return {
      x: Math.random()*w, y: h + Math.random()*20*DPR,
      vy: -(Math.random()*0.4 + 0.15)*DPR, vx: (Math.random()-0.5)*0.2*DPR,
      r: (Math.random()*1.6 + 0.5)*DPR, life:0, max:120 + Math.random()*120,
      col: palette[(Math.random()*palette.length)|0], g:0
    };
  }
  // burst: shoot a shower from a point (client coords)
  function burst(clientX, clientY){
    if(reduced) return;
    const r = canvas.getBoundingClientRect();
    const bx = (clientX - r.left) * DPR, by = (clientY - r.top) * DPR;
    const n = rankIdx === 0 ? 26 : 18;
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2, sp = (Math.random()*3.4 + 1.2)*DPR;
      parts.push({
        x:bx, y:by, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 0.6*DPR,
        r:(Math.random()*2.2 + 0.8)*DPR, life:0, max:36 + Math.random()*40,
        col: palette[(Math.random()*palette.length)|0], g:0.045*DPR
      });
    }
    if(!running){ running = true; loop(); }
  }
  function excite(){ energy = Math.min(energy + 1, 30); }  // hover pulse

  function loop(){
    if(!running) return;
    ctx.clearRect(0,0,w,h);
    const cap = AMBIENT + (energy>0?6:0);
    if(parts.length < cap && Math.random() < (energy>0?0.7:0.4)) parts.push(ambient());
    if(energy>0) energy -= 0.4;
    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life++;
      const t = p.life/p.max;
      const alpha = t < 0.15 ? t/0.15 : (1 - (t-0.15)/0.85);
      if(p.life >= p.max || p.y < -14 || p.y > h+14){ parts.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(0, alpha) * 0.9;
      ctx.fillStyle = p.col;
      ctx.shadowBlur = 6*DPR; ctx.shadowColor = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    if(parts.length === 0 && !running) return;
    raf = requestAnimationFrame(loop);
  }
  size(); if(!reduced) loop();

  const io = new IntersectionObserver((es)=>{
    es.forEach(e=>{
      if(e.isIntersecting){ if(!running && !reduced){ running = true; loop(); } }
      else { running = false; cancelAnimationFrame(raf); }
    });
  }, {threshold:0.01});
  io.observe(canvas);
  let rt;
  addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(size, 200); });

  ROW_FX.set(canvas.closest('.row'), { burst, excite });
}

/* ════════ USER INTERACTION: ripple + burst + magnetic glow ════════ */
function attachRankInteraction(row, rippleLayer, rankIdx){
  // эффект нажатия (волна и взрыв частиц) убран — остались свечение и частицы при наведении
  // hover → keep particles lively + move the glow toward cursor
  const glow = row.querySelector('.rank-glow');
  row.addEventListener('pointermove', (e)=>{
    const fx = ROW_FX.get(row);
    if(fx) fx.excite();
    if(glow){
      const r = row.getBoundingClientRect();
      const gx = ((e.clientX - r.left)/r.width*100).toFixed(1);
      glow.style.setProperty('--mx', gx + '%');
    }
  });
}

/* ════════ 3D TILT ON TOP-3 HOVER ════════ */
(function(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const SEL = '.row.rank-1, .row.rank-2, .row.rank-3';
  document.addEventListener('pointermove', (e)=>{
    const row = e.target.closest && e.target.closest(SEL);
    if(!row) return;
    // во время перетаскивания transform занят — наклон не вмешивается
    if((typeof dragState !== 'undefined' && dragState) || sortDragging) return;
    // у кнопок админа строка плавно выравнивается: 3D-поворот размывает мелкие иконки
    if(e.target.closest('.admin-col')){
      row.style.transition = 'transform .25s cubic-bezier(.16,1,.3,1)';
      row.style.transform = 'translateY(-4px)';
      return;
    }
    const r = row.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - 0.5;
    const py = (e.clientY - r.top)/r.height - 0.5;
    row.style.transition = 'transform .08s linear';
    const fade = isAdmin ? Math.max(0, Math.min(1, (r.right - 120 - e.clientX) / 140)) : 1;
    if(fade <= 0){ row.style.transform = 'translateY(-4px)'; return; }
    row.style.transform = `translateY(-4px) perspective(900px) rotateX(${(-py*4*fade).toFixed(2)}deg) rotateY(${(px*5*fade).toFixed(2)}deg) scale(${(1 + 0.012*fade).toFixed(4)})`;
  });
  document.addEventListener('pointerout', (e)=>{
    const row = e.target.closest && e.target.closest(SEL);
    if((typeof dragState !== 'undefined' && dragState) || sortDragging) return;
    if(row && (!e.relatedTarget || !row.contains(e.relatedTarget))){
      row.style.transition = 'transform .5s cubic-bezier(.16,1,.3,1)';
      row.style.transform = '';
      const glow = row.querySelector('.rank-glow');
      if(glow) glow.style.setProperty('--mx','0%');
    }
  });
})();
</script>
