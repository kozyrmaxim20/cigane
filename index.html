    levels: state.levels,
    futureLevels: state.futureLevels,
    nonListedLevels: state.nonListedLevels,
    players: state.players,
    rules: state.rules,
  };
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lemon-list-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  setStatus(I18N[currentLang].backupDone);
}

  document.body.classList.toggle('hide-beaten', hideBt);

  if(btn){
    btn.classList.toggle('is-off', visMode !== 'none');
    const t = I18N[currentLang];
    const label = (visMode === 'none') ? t.hideControls : t.showControls;
    btn.title = label;

}

function onVisOutside(e){
  const m = document.getElementById('visMenu');
  const btn = document.getElementById('toggleControlsBtn');
  if(m && !m.contains(e.target) && btn && !btn.contains(e.target)) closeVisMenu();

  e.stopPropagation();
  if(document.getElementById('visMenu')){ closeVisMenu(); return; }
  const t = I18N[currentLang];
  const btn = e.currentTarget;
  const menu = document.createElement('div');
  menu.className = 'vis-menu';
  menu.id = 'visMenu';
  menu.innerHTML = [
    ['none', t.visNone], ['controls', t.visControls],
    ['beaten', t.visBeaten], ['both', t.visBoth], ['onlyBeaten', t.visOnlyBeaten],
  ].map(([mode, label]) =>
    `<button data-mode="${mode}" class="${visMode === mode ? 'active' : ''}">${label}</button>`
  ).join('');
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect();
  menu.style.top  = (window.scrollY + r.bottom + 8) + 'px';
  menu.style.left = (window.scrollX + Math.min(r.left, window.innerWidth - menu.offsetWidth - 12)) + 'px';

    b.addEventListener('click', () => {
      visMode = b.getAttribute('data-mode');
      try{ localStorage.setItem(CONTROLS_KEY, visMode); }catch(err){}

  fPoints.value = cfg.metaKind === 'progress' ? parseProgress(lvl.progress) : lvl.points;
  fIsNew.checked = !!lvl.isNew;
  fExtra.value = lvl.extra || '';
  fCreator.value = lvl.creator || '';
  fThumb.value = lvl.thumbnail || '';
  fVideo.value = lvl.videoUrl || '';
  fDesc.value = lvl.description || '';
  fLevelId.value = lvl.levelId || '';
  fPassword.value = lvl.password || '';
  fLength.value = lvl.length || '';
  fObjects.value = lvl.objects || '';
  fVersion.value = lvl.version || '';
  fHistoryExtra.value = lvl.historyExtra || '';
  fRecords.value = lvl.records || '';
  if(rowEl && rowEl.parentNode){
    rowEl.parentNode.insertBefore(addForm, rowEl.nextSibling);
    addForm.classList.add('inline-edit');
  }
  addForm.classList.add('open');
  openFormBtn.style.display = 'none';
  addForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
  fName.focus();
}

document.getElementById('cancelBtn').addEventListener('click', closeForm);

function closeForm(){
  restoreFormHome();
  addForm.classList.remove('open');
  openFormBtn.style.display = 'block';
  editingId = null;
  fName.value = ''; fVerifier.value = ''; fPoints.value = ''; fExtra.value = '';
  detailFields.forEach(f => f.value = '');
}

submitBtn.addEventListener('click', () => {
  const cfg = TAB_CONFIG[currentTab];
  if(!fName.value.trim()){
    fName.focus();
    return;
  }
  const arr = getArr();
  const detailValues = {
    creator: fCreator.value.trim(),
    thumbnail: fThumb.value.trim(),
    videoUrl: fVideo.value.trim(),
    description: fDesc.value.trim(),
    levelId: fLevelId.value.trim(),
    password: fPassword.value.trim(),
    length: fLength.value.trim(),
    objects: fObjects.value.trim(),
    version: fVersion.value.trim(),
    historyExtra: fHistoryExtra.value.trim(),
    records: fRecords.value.trim(),
  };
  if(editingId){
    const lvl = arr.find(l => l.id === editingId);
    if(lvl){
      lvl.name = fName.value.trim();
      lvl.verifier = fVerifier.value.trim();
      lvl.extra = fExtra.value.trim();
      if(fIsNew.checked){
        if(!lvl.isNew) lvl.newAt = Date.now();   // отсчёт двух недель с момента включения
        lvl.isNew = true;
      } else {
        delete lvl.isNew; delete lvl.newAt;
      }
      if(cfg.metaKind === 'progress') lvl.progress = parseProgress(fPoints.value);
      else lvl.points = Number(fPoints.value) || 0;
      Object.assign(lvl, detailValues);
    }
  } else {
    arr.push({
      id: uid(),
      ...(fIsNew.checked ? { isNew: true, newAt: Date.now() } : {}),
      name: fName.value.trim(),
      verifier: fVerifier.value.trim(),
      extra: fExtra.value.trim(),
      ...(cfg.metaKind === 'progress'
        ? { points: 0, progress: parseProgress(fPoints.value) }
        : { points: Number(fPoints.value) || 0 }),
      ...detailValues,
    });
  }
  if(cfg.autoRecalc) recalcPoints(arr);
  closeForm();
  render();
  saveLevels();
});

deleteFromFormBtn.addEventListener('click', () => {
  const cfg = TAB_CONFIG[currentTab];
  if(!editingId) return;
  const lvl = getArr().find(l => l.id === editingId);
  if(lvl && !confirm(deleteConfirmText(cfg.deleteWord, lvl.name))) return;
  const newArr = getArr().filter(l => l.id !== editingId);
  if(cfg.autoRecalc) recalcPoints(newArr);
  setArr(newArr);
  closeForm();
  render();
  saveLevels();
});

[fName, fVerifier, fPoints, fExtra, ...detailFields].forEach(input => {
  if(input.tagName === 'TEXTAREA') return; // allow multi-line input (Enter = new line)
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') submitBtn.click();
  });
});

(async function init(){
  let savedLang = 'en';
  try{ savedLang = localStorage.getItem('gll_lang') || 'en'; }catch(e){}
  currentLang = (savedLang === 'ru') ? 'ru' : 'en';
  document.documentElement.lang = currentLang;
  document.title = I18N[currentLang].docTitle;
  applyStaticTexts();
  setStatus(I18N[currentLang].statusLoading);
  document.getElementById('langRuBtn').classList.toggle('active', currentLang === 'ru');
  const codeEl2 = document.getElementById('langCurrentCode');
  if(codeEl2) codeEl2.textContent = (currentLang === 'ru') ? 'RU' : 'EN';
  document.getElementById('langEnBtn').classList.toggle('active', currentLang === 'en');

  restoreAdminSession();
  await loadLevels();

  const tabMainBtn = document.getElementById('tabMainBtn');
  const tabFutureBtn = document.getElementById('tabFutureBtn');
  const tabNonListedBtn = document.getElementById('tabNonListedBtn');
  const tabPlayersBtn = document.getElementById('tabPlayersBtn');

  window.switchTab = switchTab;
  function switchTab(tab){
    const dv = document.getElementById('detailView');
    if(dv && dv.style.display !== 'none') closeDetailModal();
    const pv = document.getElementById('playerView');
    if(pv && pv.style.display !== 'none') closePlayerProfile();
    const nv = document.getElementById('notifView');
    if(nv && nv.style.display !== 'none') closeNotifView();
    currentTab = tab;
    tabMainBtn.classList.toggle('active', tab === 'main');
    tabFutureBtn.classList.toggle('active', tab === 'future');
    tabNonListedBtn.classList.toggle('active', tab === 'nonListed');
    tabPlayersBtn.classList.toggle('active', tab === 'players');
    const titleEl = document.getElementById('currentListTitle');
    const btnMap = { main:tabMainBtn, future:tabFutureBtn, nonListed:tabNonListedBtn, players:tabPlayersBtn };
    if(titleEl && btnMap[tab]) titleEl.textContent = btnMap[tab].textContent;
    const dd = document.getElementById('listsMenu');
    if(dd) dd.classList.remove('open');
    const mm = document.getElementById('moreMenu');
    if(mm) mm.classList.remove('open');
    document.getElementById('rulesView').style.display = 'none';
    document.getElementById('listView').style.display = '';
  const sbShow = document.getElementById('searchBar');
  if(sbShow) sbShow.style.display = (currentTab === 'players') ? 'none' : '';
    searchQuery = '';
    const sIn = document.getElementById('listSearch');
    if(sIn){ sIn.textContent = ''; document.getElementById('listSearchClear').style.display = 'none'; }
    applyTabLabels();
    closeForm();
    render();
  }

  tabMainBtn.addEventListener('click', () => switchTab('main'));
  tabFutureBtn.addEventListener('click', () => switchTab('future'));
  tabNonListedBtn.addEventListener('click', () => switchTab('nonListed'));
  tabPlayersBtn.addEventListener('click', () => switchTab('players'));
  const rulesBtn = document.getElementById('rulesBtn');
  if(rulesBtn) rulesBtn.addEventListener('click', () => {
    document.getElementById('moreMenu').classList.remove('open');
    openRulesPage();
  });
  const rulesCloseBtn = document.getElementById('rulesCloseBtn');
  if(rulesCloseBtn) rulesCloseBtn.addEventListener('click', closeRulesPage);

  // Lists dropdown behaviour
  const listsMenu = document.getElementById('listsMenu');
  const listsTrigger = document.getElementById('listsTrigger');
  if(listsTrigger){
    listsTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      listsMenu.classList.toggle('open');
      const mm2 = document.getElementById('moreMenu');
      if(mm2) mm2.classList.remove('open');
    });
    document.addEventListener('click', (e) => {
      if(!listsMenu.contains(e.target)) listsMenu.classList.remove('open');
    });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') listsMenu.classList.remove('open'); });
  }
  const listSearch = document.getElementById('listSearch');
  const listSearchClear = document.getElementById('listSearchClear');
  if(listSearch){
    listSearch.addEventListener('input', () => {
      searchQuery = listSearch.textContent.replace(/\s+/g, ' ');
      listSearchClear.style.display = searchQuery ? '' : 'none';
      render();
    });
    // перевод строки и вставка форматированного текста полю не нужны
    listSearch.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') e.preventDefault();
      if(e.key === 'Escape'){ e.preventDefault(); listSearchClear.click(); }
    });
    listSearch.addEventListener('paste', (e) => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ');
      document.execCommand('insertText', false, txt);
    });
    listSearchClear.addEventListener('click', () => {
      listSearch.textContent = ''; searchQuery = '';
      listSearchClear.style.display = 'none';
      render(); listSearch.focus();
    });
  }

  const moreMenu = document.getElementById('moreMenu');
  const moreTrigger = document.getElementById('moreTrigger');
  if(moreTrigger){
    moreTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      moreMenu.classList.toggle('open');
      listsMenu.classList.remove('open');
    });
    document.addEventListener('click', (e) => {
      if(!moreMenu.contains(e.target)) moreMenu.classList.remove('open');
    });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') moreMenu.classList.remove('open'); });
  }

  // set initial section title
  const initTitle = document.getElementById('currentListTitle');
  if(initTitle) initTitle.textContent = tabMainBtn.textContent;

  document.getElementById('langRuBtn').addEventListener('click', () => { setLanguage('ru'); closeLangMenu(); });
  document.getElementById('langEnBtn').addEventListener('click', () => { setLanguage('en'); closeLangMenu(); });

  const langMenu = document.getElementById('langMenu');
  const langTrigger = document.getElementById('langTrigger');
  function closeLangMenu(){ if(langMenu) langMenu.classList.remove('open'); }
  if(langTrigger){
    langTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('open');
      const lm = document.getElementById('listsMenu');
      if(lm) lm.classList.remove('open');
    });
    document.addEventListener('click', (e) => { if(!langMenu.contains(e.target)) closeLangMenu(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLangMenu(); });
  }

  applyTabLabels();
  render();
})();
</script>


<script>
/* ════════ GLOBAL BACKGROUND PARTICLES ════════ */
(function(){
  const c = document.getElementById('bgParticles');
  if(!c) return;
  const ctx = c.getContext('2d');
  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  const COLORS = ['#e4ff5c','#b06cf0','#5cf0e4','#ffd66b'];
  let dots = [];
  const N = window.innerWidth < 640 ? 34 : 60;

  function resize(){
    W = c.width = innerWidth * DPR;
    H = c.height = innerHeight * DPR;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
  }
  function seed(){
    dots = Array.from({length:N}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.18*DPR, vy: (Math.random()-0.5)*0.18*DPR,
      r: (Math.random()*1.8 + 0.6)*DPR,
      col: COLORS[(Math.random()*COLORS.length)|0],
      a: Math.random()*0.5 + 0.15,
      tw: Math.random()*Math.PI*2
    }));
  }
  function tick(t){
    ctx.clearRect(0,0,W,H);
    for(const d of dots){
      d.x += d.vx; d.y += d.vy; d.tw += 0.02;
      if(d.x < 0) d.x = W; if(d.x > W) d.x = 0;
      if(d.y < 0) d.y = H; if(d.y > H) d.y = 0;
      const alpha = d.a * (0.6 + 0.4*Math.sin(d.tw));
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = d.col;
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 8*DPR; ctx.shadowColor = d.col;
      ctx.fill();
    }
    // connect close dots
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    for(let a=0;a<dots.length;a++){
      for(let b=a+1;b<dots.length;b++){
        const dx = dots[a].x-dots[b].x, dy = dots[a].y-dots[b].y;
        const dist = Math.hypot(dx,dy);
        if(dist < 120*DPR){
          ctx.strokeStyle = 'rgba(176,108,240,'+ (0.12*(1-dist/(120*DPR))) +')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(dots[a].x,dots[a].y); ctx.lineTo(dots[b].x,dots[b].y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  const reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  resize(); seed();
  if(!reduced) requestAnimationFrame(tick);
  else { /* draw one static frame */ tick(0); }
  addEventListener('resize', () => { resize(); seed(); });
})();

/* ════════ PER-ROW TOP-3 PARTICLES ════════ */
const ROW_FX = new WeakMap();  // row -> { burst(x,y), excite() }
function startRowParticles(canvas, rankIdx){
  const reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const palette = [
    ['#ffd66b','#fff0b0','#ffe89a'],  // gold
    ['#d8dbe8','#ffffff','#c9cce0'],  // silver
    ['#ff9d5c','#ffd0a8','#ffb87a']   // bronze
  ][rankIdx] || ['#e4ff5c'];
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let w, h, parts = [], raf, running = true, energy = 0;
  const AMBIENT = rankIdx === 0 ? 20 : 13;

  function size(){
    const r = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = r.width * DPR;
    h = canvas.height = r.height * DPR;
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
  }
  function ambient(){
    return {
      x: Math.random()*w, y: h + Math.random()*20*DPR,
      vy: -(Math.random()*0.4 + 0.15)*DPR, vx: (Math.random()-0.5)*0.2*DPR,
      r: (Math.random()*1.6 + 0.5)*DPR, life:0, max:120 + Math.random()*120,
      col: palette[(Math.random()*palette.length)|0], g:0
    };
  }
  // burst: shoot a shower from a point (client coords)
  function burst(clientX, clientY){
    if(reduced) return;
    const r = canvas.getBoundingClientRect();
    const bx = (clientX - r.left) * DPR, by = (clientY - r.top) * DPR;
    const n = rankIdx === 0 ? 26 : 18;
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2, sp = (Math.random()*3.4 + 1.2)*DPR;
      parts.push({
        x:bx, y:by, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 0.6*DPR,
        r:(Math.random()*2.2 + 0.8)*DPR, life:0, max:36 + Math.random()*40,
        col: palette[(Math.random()*palette.length)|0], g:0.045*DPR
      });
    }
    if(!running){ running = true; loop(); }
  }
  function excite(){ energy = Math.min(energy + 1, 30); }  // hover pulse

  function loop(){
    if(!running) return;
    ctx.clearRect(0,0,w,h);
    const cap = AMBIENT + (energy>0?6:0);
    if(parts.length < cap && Math.random() < (energy>0?0.7:0.4)) parts.push(ambient());
    if(energy>0) energy -= 0.4;
    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life++;
      const t = p.life/p.max;
      const alpha = t < 0.15 ? t/0.15 : (1 - (t-0.15)/0.85);
      if(p.life >= p.max || p.y < -14 || p.y > h+14){ parts.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(0, alpha) * 0.9;
      ctx.fillStyle = p.col;
      ctx.shadowBlur = 6*DPR; ctx.shadowColor = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    if(parts.length === 0 && !running) return;
    raf = requestAnimationFrame(loop);
  }
  size(); if(!reduced) loop();

  const io = new IntersectionObserver((es)=>{
    es.forEach(e=>{
      if(e.isIntersecting){ if(!running && !reduced){ running = true; loop(); } }
      else { running = false; cancelAnimationFrame(raf); }
    });
  }, {threshold:0.01});
  io.observe(canvas);
  let rt;
  addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(size, 200); });

  ROW_FX.set(canvas.closest('.row'), { burst, excite });
}

/* ════════ USER INTERACTION: ripple + burst + magnetic glow ════════ */
function attachRankInteraction(row, rippleLayer, rankIdx){
  // click → ripple ring + particle burst from the cursor
  row.addEventListener('pointerdown', (e)=>{
    const r = row.getBoundingClientRect();
    const dot = document.createElement('span');
    dot.style.left = (e.clientX - r.left) + 'px';
    dot.style.top  = (e.clientY - r.top) + 'px';
    rippleLayer.appendChild(dot);
    setTimeout(()=>dot.remove(), 750);
    const fx = ROW_FX.get(row);
    if(fx) fx.burst(e.clientX, e.clientY);
  });
  // hover → keep particles lively + move the glow toward cursor
  const glow = row.querySelector('.rank-glow');
  row.addEventListener('pointermove', (e)=>{
    const fx = ROW_FX.get(row);
    if(fx) fx.excite();
    if(glow){
      const r = row.getBoundingClientRect();
      const gx = ((e.clientX - r.left)/r.width*100).toFixed(1);
      glow.style.setProperty('--mx', gx + '%');
    }
  });
}

/* ════════ 3D TILT ON TOP-3 HOVER ════════ */
(function(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const SEL = '.row.rank-1, .row.rank-2, .row.rank-3';
  document.addEventListener('pointermove', (e)=>{
    const row = e.target.closest && e.target.closest(SEL);
    if(!row) return;
    const r = row.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - 0.5;
    const py = (e.clientY - r.top)/r.height - 0.5;
    row.style.transition = 'transform .08s linear';
    row.style.transform = `translateY(-4px) perspective(900px) rotateX(${(-py*4).toFixed(2)}deg) rotateY(${(px*5).toFixed(2)}deg) scale(1.012)`;
  });
  document.addEventListener('pointerout', (e)=>{
    const row = e.target.closest && e.target.closest(SEL);
    if(row && (!e.relatedTarget || !row.contains(e.relatedTarget))){
      row.style.transition = 'transform .5s cubic-bezier(.16,1,.3,1)';
      row.style.transform = '';
      const glow = row.querySelector('.rank-glow');
      if(glow) glow.style.setProperty('--mx','0%');
    }
  });
})();
</script>
